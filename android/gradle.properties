# Gradle daemon memory. Flutter's template default (-Xmx8G, 4G metaspace)
# exceeds the RAM of 8 GB development machines once an emulator is running
# and crashed the daemon (native allocation failure). 3G is ample for this app;
# raise it on larger machines or CI if builds report heap exhaustion.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# DORY store identity. Replace with the company reverse domain before the
# first release; see docs/DEVELOPMENT_GUIDE.md ("App identity").
dory.applicationId=com.dory.app
